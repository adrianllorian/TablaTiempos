# Los datos (base de datos y fotos) se guardan en la carpeta "data" que hay
# junto al JAR o al ejecutable. ConfiguracionDatos la resuelve al arrancar.
# Estos valores son solo el respaldo para desarrollo y pruebas.
spring.datasource.url=jdbc:h2:file:./data/tabla-tiempo;WRITE_DELAY=0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

server.port=${SERVER_PORT:8080}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# ConfiguracionDatos lo cambia a <carpeta del JAR>/data/uploads
app.upload-dir=./data/uploads

# Abrir el navegador al arrancar (poner ABRIR_NAVEGADOR=false para desactivarlo)
app.abrir-navegador=${ABRIR_NAVEGADOR:true}
